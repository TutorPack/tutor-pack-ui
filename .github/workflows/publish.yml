name: build and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore TutorPack.UI.slnx
      - name: Build
        run: dotnet build TutorPack.UI.slnx --configuration Release --no-restore
      - name: Pack
        run: dotnet pack src/TutorPack.UI/TutorPack.UI.csproj --configuration Release --no-build --output artifacts
      - name: Verify package
        shell: bash
        run: |
          test -f artifacts/TutorPack.UI.1.0.0.nupkg
          unzip -l artifacts/TutorPack.UI.1.0.0.nupkg | grep -q 'staticwebassets'

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Verify version tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          package_version=$(dotnet msbuild src/TutorPack.UI/TutorPack.UI.csproj -getProperty:Version)
          if [ "${GITHUB_REF_NAME#v}" != "$package_version" ]; then
            echo "Tag must match the package version ($package_version)." >&2
            exit 1
          fi
      - name: Pack
        run: dotnet pack src/TutorPack.UI/TutorPack.UI.csproj --configuration Release --output artifacts
      - name: Get temporary NuGet.org publishing key
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"
